services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-language-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_language_learning}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ai_language_learning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web UI to browse the database. Not required to run the
  # backend - start it only when you need it:
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-language-learning-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
