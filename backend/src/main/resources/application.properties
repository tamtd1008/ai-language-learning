spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Default admin account, seeded on startup if it doesn't exist yet (see
# AdminSeeder). Override via env vars - especially the password - anywhere
# outside local dev.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- AI provider (AI-01+) ----
# Which AIProvider bean is active: ollama (default, local, no API key) |
# mock (tests / no network) | gemini (cloud, needs GEMINI_API_KEY).
app.ai.provider=${AI_PROVIDER:ollama}

# Ollama must be running locally with required models pulled. New
# conversations use qwen3:1.7b; this default is used by other AI tasks.
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen3:4b}
# Local inference (esp. CPU-only, or the model's first call after
# Ollama loads it into RAM) can be slow - raise this if you keep
# hitting 502 timeouts on a slower machine.
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
# Keep the model loaded between turns and bound the maximum generated output
# so a local CPU model cannot spend minutes generating an unexpectedly long reply.
app.ai.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:10m}
app.ai.ollama.max-output-tokens=${OLLAMA_MAX_OUTPUT_TOKENS:256}

# Only needed when app.ai.provider=gemini. Get a key at
# https://aistudio.google.com/apikey - check current model ids at
# https://ai.google.dev/gemini-api/docs/models before relying on the
# default below, Google renames/retires them periodically.
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# ---- Speech provider (STT-01+/TTS-01+) ----
# Legacy shared fallback; individual STT/TTS/assessment providers can
# override this so local Whisper + Piper can be paired independently.
app.speech.provider=${SPEECH_PROVIDER:mock}
app.speech.stt.provider=${SPEECH_STT_PROVIDER:${SPEECH_PROVIDER:mock}}
app.speech.tts.provider=${SPEECH_TTS_PROVIDER:${SPEECH_PROVIDER:mock}}
app.speech.assessment.provider=${SPEECH_ASSESSMENT_PROVIDER:${SPEECH_PROVIDER:mock}}

app.speech.azure.subscription-key=${AZURE_SPEECH_KEY:}
# Azure region identifier, e.g. southeastasia, eastus - must match the
# region your Speech resource was created in.
app.speech.azure.region=${AZURE_SPEECH_REGION:southeastasia}
app.speech.azure.default-language=${AZURE_SPEECH_LANGUAGE:en-US}
app.speech.azure.default-voice=${AZURE_SPEECH_VOICE:en-US-JennyNeural}
app.speech.azure.timeout-seconds=${AZURE_SPEECH_TIMEOUT_SECONDS:30}

app.speech.piper.base-url=${PIPER_BASE_URL:http://localhost:5001}
app.speech.piper.voice=${PIPER_VOICE:en_US-lessac-medium}
app.speech.piper.timeout-seconds=${PIPER_TIMEOUT_SECONDS:60}

app.speech.whisper.base-url=${WHISPER_BASE_URL:http://localhost:5002}
app.speech.whisper.language=${WHISPER_LANGUAGE:auto}
app.speech.whisper.timeout-seconds=${WHISPER_TIMEOUT_SECONDS:120}

# Audio uploads (STT-02/STT-04) - short conversation turns only.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
